name: build windows exe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: configure
        run: cmake -S native -B build -A x64

      - name: build
        run: cmake --build build --config Release --parallel

      - name: collect exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/puterforge.exe dist/puterforge.exe

      - name: upload exe
        uses: actions/upload-artifact@v4
        with:
          name: puterforge-windows-x64
          path: dist/puterforge.exe
